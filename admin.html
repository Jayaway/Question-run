<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>访问统计 · 站长后台</title>
<link rel="icon" type="image/webp" sizes="16x16" href="./assets/favicon-16x16.webp">
<link rel="icon" type="image/webp" sizes="32x32" href="./assets/favicon-32x32.webp">
<link rel="icon" type="image/webp" sizes="64x64" href="./assets/favicon-64x64.webp">
<link rel="icon" type="image/webp" sizes="128x128" href="./assets/favicon-128x128.webp">
<link rel="apple-touch-icon" sizes="180x180" href="./assets/apple-touch-icon.png">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans SC', Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
  background: #f5f1e8;
  color: #725d42;
  min-height: 100vh;
}

.login-overlay {
  position: fixed; inset: 0; z-index: 100;
  display: flex; align-items: center; justify-content: center;
  background: #f5f1e8;
}
.login-card {
  width: min(380px, 90vw);
  padding: 40px 32px;
  border: 2px solid #e8e2d6;
  border-radius: 28px;
  background: #f8f8f0;
  box-shadow: 0 4px 0 0 #d4c9b4, 0 12px 40px rgba(61,52,40,.08);
  text-align: center;
}
.login-card, .login-card * {
  font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans SC', Arial, sans-serif !important;
}
.login-icon { font-size: 48px; margin-bottom: 8px; }
.login-title {
  font-size: 22px; font-weight: 700; color: #725d42; margin-bottom: 6px;
  letter-spacing: 0;
}
.login-sub {
  font-size: 13px; color: #9f927d; margin-bottom: 24px;
}
.login-input {
  width: 100%; height: 48px;
  padding: 0 18px;
  border: 2px solid #c4b89e;
  border-radius: 50px;
  background: #f8f8f0;
  color: #725d42;
  font-size: 15px; font-family: inherit; font-weight: 600;
  box-shadow: 0 3px 0 0 #d4c9b4;
  outline: none;
  transition: all .2s;
  text-align: center;
  letter-spacing: 4px;
}
.login-input:focus { border-color: #19c8b9; box-shadow: 0 3px 0 0 #14a89b; }
.login-input::placeholder { color: #c4b89e; letter-spacing: 0; }
.login-btn {
  width: 100%; height: 48px; margin-top: 16px;
  border: 2px solid #19c8b9;
  border-radius: 50px;
  background: #19c8b9;
  color: #fff;
  font-size: 15px; font-weight: 700;
  cursor: pointer;
  box-shadow: 0 4px 0 0 #14a89b;
  transition: all .2s;
}
.login-btn:hover { background: #1ddbc8; }
.login-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 0 #14a89b; }
.login-error { color: #e05a5a; font-size: 13px; margin-top: 12px; font-weight: 600; }

.admin-body { max-width: 800px; margin: 0 auto; padding: 32px 20px 60px; }
.island-header {
  display: flex; align-items: flex-start; justify-content: space-between;
  gap: 16px; padding: 24px 28px;
  border: 2px solid #e8e2d6; border-radius: 24px;
  background: #f8f8f0;
  box-shadow: 0 4px 0 0 #d4c9b4, 0 12px 32px rgba(61,52,40,.06);
  margin-bottom: 20px;
}
.island-eyebrow { color: #9f927d; font-size: 12px; font-weight: 700; }
.island-title { color: #725d42; font-size: 28px; font-weight: 800; margin: 4px 0 0; }
.island-subtitle { color: #9f927d; font-size: 14px; margin: 6px 0 0; }
.island-btn {
  display: inline-flex; align-items: center; justify-content: center;
  gap: 6px; font-weight: 700; font-size: 13px; cursor: pointer;
  border: 2px solid #c4b89e; border-radius: 50px;
  background: #f8f8f0; color: #725d42;
  padding: 8px 20px;
  box-shadow: 0 3px 0 0 #bdaea0;
  transition: all .2s; font-family: inherit;
}
.island-btn:hover { transform: translateY(-1px); box-shadow: 0 5px 0 0 #bdaea0; }
.island-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 0 #bdaea0; }

.island-stats-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 16px;
  margin-bottom: 20px;
}
.island-card {
  padding: 20px 24px;
  border: 2px solid #e8e2d6;
  border-radius: 24px;
  background: #f8f8f0;
  color: #725d42;
  box-shadow: 0 3px 10px rgba(61,52,40,.08);
  transition: transform .3s ease, box-shadow .3s ease;
}
.island-card:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(61,52,40,.12); }
.island-card-teal { background: #e6f9f6; border-color: #b2e8dc; }
.island-card-yellow { background: #fff8e1; border-color: #e8d89e; }
.island-card-green { background: #edf7e6; border-color: #c6e0b4; }
.island-card-pink { background: #fef0f0; border-color: #f0c8c8; }
.island-stat-icon { font-size: 32px; line-height: 1; margin-bottom: 6px; }
.island-stat-body { display: grid; gap: 4px; }
.island-stat-label { color: #9f927d; font-size: 13px; font-weight: 700; }
.island-stat-value { font-size: 38px; font-weight: 900; color: #794f27; line-height: 1; }
.island-stat-note { color: #9f927d; font-size: 12px; }

.island-chart-card { padding: 24px 28px; margin-bottom: 20px; }
.island-chart-wrap { width: 100%; overflow-x: auto; }
.island-chart-wrap canvas {
  display: block; width: 100%; max-width: 100%;
  height: auto; border-radius: 16px;
}
.island-chart-legend {
  display: flex; gap: 20px; margin-top: 12px; justify-content: center;
}
.island-legend-uv { color: #19c8b9; font-size: 13px; font-weight: 700; }
.island-legend-pv { color: #f5c31c; font-size: 13px; font-weight: 700; }

.island-card-header {
  display: flex; align-items: center; justify-content: space-between;
  gap: 12px; margin-bottom: 16px;
}
.island-card-title { margin: 0; color: #725d42; font-size: 18px; font-weight: 800; }
.island-chip {
  display: inline-flex; align-items: center; justify-content: center;
  min-width: 50px; height: 28px; padding: 0 12px;
  border-radius: 50px; background: #e6f9f6; color: #19c8b9;
  font-size: 12px; font-weight: 700;
}

.island-two-col {
  display: grid; grid-template-columns: 1fr 1fr; gap: 16px;
  margin-bottom: 20px;
}
.island-rank-list, .island-recent-list {
  margin: 0; padding: 0; list-style: none; display: grid; gap: 10px;
}
.island-rank-item {
  display: flex; align-items: center; gap: 12px;
  padding: 14px 16px; border-radius: 16px;
  background: #f0e8d8; font-weight: 600; color: #725d42;
}
.island-rank-idx {
  display: inline-flex; align-items: center; justify-content: center;
  width: 28px; height: 28px; border-radius: 50%;
  background: #e6f9f6; color: #19c8b9;
  font-size: 13px; font-weight: 900; flex-shrink: 0;
}
.island-rank-idx.top { background: #f5c31c; color: #725d42; }
.island-rank-page { flex: 1; font-size: 14px; }
.island-rank-count { color: #9f927d; font-size: 13px; }

.island-recent-item {
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px;
  padding: 14px 16px; border-radius: 16px;
  background: #f0e8d8; font-weight: 600; color: #725d42;
}
.island-recent-time {
  display: inline-flex; align-items: center; justify-content: center;
  min-width: 56px; height: 32px; padding: 0 12px;
  border-radius: 50px; background: #19c8b9; color: #fff;
  font-size: 13px; font-weight: 800;
}
.island-recent-page { font-size: 14px; }
.island-recent-sep { color: #c4b89e; }
.island-recent-meta { color: #9f927d; font-size: 13px; }
.island-tag { display: inline-flex; align-items: center; height: 22px; padding: 0 8px; border-radius: 50px; font-size: 11px; font-weight: 800; margin-left: 4px; }
.island-tag-student { background: #e6f9f6; color: #19c8b9; }
.island-tag-king { background: #fff3cd; color: #c79100; }

.island-leaderboard-card { margin-top: 20px; }
.island-lb-list { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; }
.island-lb-item { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: 16px; background: #f0e8d8; font-weight: 600; color: #725d42; }
.island-lb-rank { display: inline-flex; align-items: center; justify-content: center; width: 28px; height: 28px; border-radius: 50%; background: #e6f9f6; color: #19c8b9; font-size: 13px; font-weight: 900; flex-shrink: 0; }
.island-lb-rank.top { background: #f5c31c; color: #725d42; }
.island-lb-name { flex: 1; font-size: 14px; color: #19c8b9; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.island-lb-count { font-size: 15px; font-weight: 800; color: #794f27; }
.island-lb-note { text-align: center; padding: 20px; color: #9f927d; font-size: 13px; }

@media (max-width: 700px) {
  .admin-body { padding: 20px 12px 60px; }
  .island-header { flex-direction: column; }
  .island-stats-grid { grid-template-columns: 1fr; }
  .island-two-col { grid-template-columns: 1fr; }
  .island-chart-wrap canvas { min-width: 360px; }
  .island-stat-value { font-size: 30px; }
}
</style>
</head>
<body>

<div id="loginOverlay" class="login-overlay">
  <div class="login-card">
    <div class="login-icon">🏝️</div>
    <div class="login-title">站长后台</div>
    <div class="login-sub">请输入管理员密码</div>
    <input id="pwdInput" class="login-input" type="password" placeholder="密码" maxlength="32" autocomplete="off">
    <button id="loginBtn" class="login-btn">进入后台</button>
    <p id="loginError" class="login-error"></p>
  </div>
</div>

<div id="dashboard" class="admin-body" style="display:none">
  <header class="island-header">
    <div>
      <span class="island-eyebrow">📊 站长看板</span>
      <h1 class="island-title">访问统计</h1>
      <p class="island-subtitle">看看今天有多少小动物来串门啦～</p>
    </div>
    <button onclick="doLogout()" class="island-btn">退出</button>
  </header>

  <section class="island-stats-grid">
    <article class="island-card island-card-teal">
      <div class="island-stat-icon">🌿</div>
      <div class="island-stat-body">
        <span class="island-stat-label">今日访客</span>
        <strong id="vTodayUV" class="island-stat-value">--</strong>
        <small class="island-stat-note">独立 IP 访问</small>
      </div>
    </article>
    <article class="island-card island-card-yellow">
      <div class="island-stat-icon">🌻</div>
      <div class="island-stat-body">
        <span class="island-stat-label">今日浏览</span>
        <strong id="vTodayPV" class="island-stat-value">--</strong>
        <small class="island-stat-note">页面 PV</small>
      </div>
    </article>
    <article class="island-card island-card-green">
      <div class="island-stat-icon">🌳</div>
      <div class="island-stat-body">
        <span class="island-stat-label">总访客</span>
        <strong id="vTotalUV" class="island-stat-value">--</strong>
        <small class="island-stat-note">历史 UV</small>
      </div>
    </article>
    <article class="island-card island-card-pink">
      <div class="island-stat-icon">🍀</div>
      <div class="island-stat-body">
        <span class="island-stat-label">总浏览</span>
        <strong id="vTotalPV" class="island-stat-value">--</strong>
        <small class="island-stat-note">历史 PV</small>
      </div>
    </article>
  </section>

  <section class="island-card island-chart-card">
    <div class="island-card-header">
      <h3 class="island-card-title">📈 近 7 天访问趋势</h3>
    </div>
    <div class="island-chart-wrap">
      <canvas id="trendChart" width="600" height="200"></canvas>
    </div>
    <div class="island-chart-legend">
      <span class="island-legend-uv">● 访客数 UV</span>
      <span class="island-legend-pv">● 浏览数 PV</span>
    </div>
  </section>

  <div class="island-two-col">
    <section class="island-card">
      <div class="island-card-header">
        <h3 class="island-card-title">🏆 页面访问排行</h3>
      </div>
      <ul id="pageRankList" class="island-rank-list"></ul>
    </section>

    <section class="island-card">
      <div class="island-card-header">
        <h3 class="island-card-title">🕐 最近访问</h3>
        <span id="recentCount" class="island-chip">0 条</span>
      </div>
      <ul id="recentList" class="island-recent-list"></ul>
    </section>
  </div>

  <section class="island-card island-leaderboard-card">
    <div class="island-card-header">
      <h3 class="island-card-title">👑 用户做题排行榜</h3>
      <span class="island-chip">去重统计</span>
    </div>
    <ul id="leaderboardList" class="island-lb-list"></ul>
  </section>
</div>

<script src="./config.js?v=20260610a"></script>
<script>
(function() {
  var API = function(p) { return (window.API_BASE || "") + p; };
  var statsData = null;
  var authToken = sessionStorage.getItem("admin_token") || "";

  var loginOverlay = document.getElementById("loginOverlay");
  var dashboard = document.getElementById("dashboard");
  var pwdInput = document.getElementById("pwdInput");
  var loginBtn = document.getElementById("loginBtn");
  var loginError = document.getElementById("loginError");

  function esc(s) { return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

  if (sessionStorage.getItem("admin_authed") === "1") {
    showDashboard();
  }

  loginBtn.addEventListener("click", doLogin);
  pwdInput.addEventListener("keydown", function(e) { if (e.key === "Enter") doLogin(); });

  function doLogin() {
    fetch(API("/api/login"), {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ password: pwdInput.value })
    })
      .then(function(r) {
        if (!r.ok) throw new Error("密码错误，请重试");
        return r.json();
      })
      .then(function(data) {
        authToken = data.token || "";
        sessionStorage.setItem("admin_authed", "1");
        sessionStorage.setItem("admin_token", authToken);
        loginError.textContent = "";
        showDashboard();
      })
      .catch(function(error) {
        loginError.textContent = error.message || "密码错误，请重试";
        pwdInput.value = "";
        pwdInput.focus();
      });
  }

  function failLogin() {
      sessionStorage.removeItem("admin_authed");
      sessionStorage.removeItem("admin_token");
      authToken = "";
      loginOverlay.style.display = "flex";
      dashboard.style.display = "none";
      loginError.textContent = "密码错误，请重试";
      pwdInput.value = "";
      pwdInput.focus();
  }

  function doLogout() {
    sessionStorage.removeItem("admin_authed");
    sessionStorage.removeItem("admin_token");
    authToken = "";
    loginOverlay.style.display = "flex";
    dashboard.style.display = "none";
    pwdInput.value = "";
    pwdInput.focus();
  }
  window.doLogout = doLogout;

  function showDashboard() {
    loginOverlay.style.display = "none";
    dashboard.style.display = "block";
    fetch(API("/api/stats"), { headers: { Authorization: "Bearer " + authToken } })
      .then(function(r) { return r.json(); })
      .then(function(data) { statsData = data; fillDashboard(); })
      .catch(function() { failLogin(); });
  }

  function fillDashboard() {
    var d = statsData || { todayUV: 0, todayPV: 0, totalUV: 0, totalPV: 0, pageRank: [], recent: [], weekly: [] };
    document.getElementById("vTodayUV").textContent = d.todayUV;
    document.getElementById("vTodayPV").textContent = d.todayPV;
    document.getElementById("vTotalUV").textContent = d.totalUV;
    document.getElementById("vTotalPV").textContent = d.totalPV;

    document.getElementById("recentCount").textContent = (d.recent || []).length + " 条";
    document.getElementById("recentList").innerHTML = (d.recent || []).map(function(item) {
      return '<li class="island-recent-item">'
        + '<span class="island-recent-time">' + esc(item.time || "") + '</span>'
        + '<span class="island-recent-page">' + esc(item.page || "") + '</span>'
        + '<span class="island-recent-sep">·</span>'
        + '<span class="island-recent-meta">' + esc(item.device || "") + ' / ' + esc(item.location || "") + '</span>'
        + (item.tags === '卷王' ? '<span class="island-tag island-tag-king">🔥卷王</span>' : '')
        + (item.tags === '杉达学生' ? '<span class="island-tag island-tag-student">🎓杉达学生</span>' : '')
        + '</li>';
    }).join("") || '<li style="padding:20px;color:#9f927d;text-align:center">暂无数据</li>';

    var rank = d.pageRank || [];
    document.getElementById("pageRankList").innerHTML = rank.length
      ? rank.map(function(item, idx) {
          return '<li class="island-rank-item">'
            + '<span class="island-rank-idx' + (idx < 3 ? ' top' : '') + '">' + (idx + 1) + '</span>'
            + '<span class="island-rank-page">' + esc(item.page) + '</span>'
            + '<span class="island-rank-count">' + item.count + ' 次</span>'
            + '</li>';
        }).join("")
      : '<li style="padding:20px;color:#9f927d;text-align:center">暂无数据</li>';

    drawChart();
    fetchLeaderboard();
  }

  function drawChart() {
    var canvas = document.getElementById("trendChart");
    if (!canvas) return;
    var ctx = canvas.getContext("2d");
    var dpr = window.devicePixelRatio || 1;
    var rect = canvas.parentNode.getBoundingClientRect();
    var w = Math.max(rect.width, 360);
    var h = 200;
    canvas.width = w * dpr;
    canvas.height = h * dpr;
    canvas.style.width = w + "px";
    canvas.style.height = h + "px";
    ctx.scale(dpr, dpr);

    var pad = { top: 16, right: 16, bottom: 28, left: 38 };
    var gw = w - pad.left - pad.right;
    var gh = h - pad.top - pad.bottom;
    var data = (statsData && statsData.weekly && statsData.weekly.length) ? statsData.weekly : [{ day: "?", uv: 0, pv: 0 }];
    var maxVal = Math.max.apply(null, data.map(function(d) { return d.pv; })) || 1;

    ctx.clearRect(0, 0, w, h);
    ctx.fillStyle = "#faf8f5";
    ctx.fillRect(0, 0, w, h);

    ctx.strokeStyle = "#e8e2d6";
    ctx.lineWidth = 1;
    for (var i = 0; i <= 4; i++) {
      var y = pad.top + (gh / 4) * i;
      ctx.beginPath();
      ctx.moveTo(pad.left, y);
      ctx.lineTo(w - pad.right, y);
      ctx.stroke();
    }

    data.forEach(function(d, i) {
      var x = pad.left + (gw / (data.length - 1 || 1)) * i;
      ctx.fillStyle = "#9f927d";
      ctx.font = "600 11px Nunito, 'Noto Sans SC', sans-serif";
      ctx.textAlign = "center";
      ctx.fillText(d.day, x, h - 6);
    });

    function drawLine(values, color) {
      var pts = values.map(function(v, i) {
        return { x: pad.left + (gw / (values.length - 1 || 1)) * i, y: pad.top + gh - (v / maxVal) * gh };
      });
      ctx.beginPath();
      ctx.moveTo(pts[0].x, pts[0].y);
      for (var i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
      ctx.strokeStyle = color;
      ctx.lineWidth = 2.5;
      ctx.lineJoin = "round";
      ctx.stroke();
      pts.forEach(function(p) {
        ctx.beginPath();
        ctx.arc(p.x, p.y, 4, 0, Math.PI * 2);
        ctx.fillStyle = color;
        ctx.fill();
        ctx.beginPath();
        ctx.arc(p.x, p.y, 4, 0, Math.PI * 2);
        ctx.strokeStyle = "#fff";
        ctx.lineWidth = 2;
        ctx.stroke();
      });
    }

    drawLine(data.map(function(d) { return d.uv; }), "#19c8b9");
    drawLine(data.map(function(d) { return d.pv; }), "#f5c31c");
  }

  function fetchLeaderboard() {
    if (!authToken) return;
    fetch(API("/api/leaderboard"), { headers: { Authorization: "Bearer " + authToken } })
      .then(function(r) { return r.json(); })
      .then(function(data) {
        var list = document.getElementById("leaderboardList");
        if (!list) return;
        if (!data || !data.length) {
          list.innerHTML = '<li class="island-lb-note">暂无数据，同学们快来刷题吧～</li>';
          return;
        }
        list.innerHTML = data.slice(0, 30).map(function(item, idx) {
          return '<li class="island-lb-item">'
            + '<span class="island-lb-rank' + (idx < 3 ? ' top' : '') + '">' + (idx + 1) + '</span>'
            + '<span class="island-lb-name">同学 ' + (idx + 1) + '</span>'
            + '<span class="island-lb-count">' + item.count + ' 题</span>'
            + '</li>';
        }).join('');
      })
      .catch(function() {});
  }

  window.addEventListener("resize", function() {
    if (dashboard.style.display !== "none") drawChart();
  });
})();
</script>
</body>
</html>

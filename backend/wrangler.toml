# Cloudflare Worker 配置
# 完整文档：https://developers.cloudflare.com/workers/wrangler/configuration/

name = "quiz-rank-backend"
main = "src/worker.js"
compatibility_date = "2025-05-01"

# 绑定 D1 数据库
[[d1_databases]]
binding = "DB"                       # 代码里通过 env.DB 访问
database_name = "question"
database_id = "c9e0f00e-b817-4b0c-82ca-47f6ef6b809c"

# 环境变量（非敏感）
[vars]
# 允许跨域的来源，逗号分隔；上线域名 + 本地开发地址都列上
ALLOW_ORIGIN = "https://comun.store,http://localhost:3000,http://127.0.0.1:3000"

# 敏感变量请用 wrangler secret put ADMIN_PASSWORD
# 不要在这个文件里硬编码密码
